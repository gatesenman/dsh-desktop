<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>设置 — DSH Desktop</title>
  <style>
    :root { --accent: #2B6CEA; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 22px 26px;
      user-select: none;
    }
    .titlebar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .titlebar img { width: 28px; height: 28px; }
    h1 { font-size: 17px; margin: 0; font-weight: 600; }
    .group {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 2px 16px;
      margin-bottom: 14px;
    }
    .group-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 2px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid #21262d;
    }
    .group .row:last-child { border-bottom: none; }
    .row .label { font-size: 14px; }
    .row .desc { font-size: 12px; color: #8b949e; margin-top: 3px; }
    .switch { position: relative; width: 40px; height: 22px; flex: none; margin-left: 16px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #30363d; border-radius: 22px; transition: 0.2s;
    }
    .slider:before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; top: 3px; background: #e6edf3; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }
    .actions { display: flex; gap: 10px; align-items: center; padding: 13px 0; flex-wrap: wrap; }
    .actions button { white-space: nowrap; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button:disabled { opacity: 0.6; cursor: default; }
    #updateStatus, #maintStatus { font-size: 13px; color: #8b949e; padding-bottom: 12px; min-height: 18px; }
    #updateStatus.ok, #maintStatus.ok { color: #3fb950; }
    #updateStatus.err, #maintStatus.err { color: #f85149; }
    .bar-wrap { height: 4px; background: #21262d; border-radius: 4px; overflow: hidden; margin-bottom: 12px; display: none; }
    .bar-wrap.show { display: block; }
    #updateBar {
      height: 100%; width: 30%; background: var(--accent); border-radius: 4px;
      animation: indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { margin-left: -30%; }
      100% { margin-left: 100%; }
    }
    .meta { font-size: 12px; color: #8b949e; line-height: 1.9; padding: 12px 0; white-space: pre-line; user-select: text; }
  </style>
</head>
<body>
  <div class="titlebar"><img src="icon.png" alt="" /><h1>设置</h1></div>

  <div class="group-title">通用</div>
  <div class="group">
    <div class="row">
      <div>
        <div class="label">开机自动启动</div>
        <div class="desc">登录系统后自动启动 DSH Desktop</div>
      </div>
      <label class="switch"><input type="checkbox" id="openAtLogin" /><span class="slider"></span></label>
    </div>
    <div class="row">
      <div>
        <div class="label">关闭窗口时最小化到托盘</div>
        <div class="desc">关闭主窗口后在系统托盘继续运行，服务不中断</div>
      </div>
      <label class="switch"><input type="checkbox" id="closeToTray" /><span class="slider"></span></label>
    </div>
  </div>

  <div class="group-title">更新</div>
  <div class="group">
    <div class="row">
      <div>
        <div class="label">启动时自动更新 dsh</div>
        <div class="desc">每次启动自动检查并安装 @deepseek-ai/dsh 新版本</div>
      </div>
      <label class="switch"><input type="checkbox" id="autoUpdateDsh" /><span class="slider"></span></label>
    </div>
    <div class="actions">
      <button id="updateBtn">立即检查并更新 dsh</button>
      <button id="restartBtn" class="secondary">重启服务</button>
      <button id="dataDirBtn" class="secondary">打开数据目录</button>
      <button id="logsBtn" class="secondary">查看控制台日志</button>
    </div>
    <div class="bar-wrap" id="updateBarWrap"><div id="updateBar"></div></div>
    <div id="updateStatus"></div>
  </div>

  <div class="group-title">维护</div>
  <div class="group">
    <div class="actions">
      <button id="doctorBtn" class="secondary">环境体检</button>
      <button id="backupBtn" class="secondary">备份数据</button>
      <button id="restoreBtn" class="secondary">恢复备份</button>
      <button id="rollbackBtn" class="secondary">回滚 dsh</button>
    </div>
    <div id="maintStatus"></div>
  </div>

  <div class="group-title">关于</div>
  <div class="group">
    <div class="meta" id="meta"></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
