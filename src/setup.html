<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>DSH Desktop</title>
  <style>
    :root {
      --accent: #fb923c;
      --accent2: #f43f5e;
      --accent3: #a78bfa;
      --ok: #34d399;
      --muted: #9aa4b2;
    }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #07080f;
      color: #eef2f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      user-select: none;
      overflow: hidden;
      position: relative;
    }
    /* aurora background */
    .aurora {
      position: absolute;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.32;
      pointer-events: none;
    }
    .aurora.a {
      background: radial-gradient(circle, var(--accent) 0%, transparent 65%);
      top: -240px;
      left: -140px;
      animation: drift-a 11s ease-in-out infinite alternate;
    }
    .aurora.b {
      background: radial-gradient(circle, var(--accent3) 0%, transparent 65%);
      bottom: -260px;
      right: -160px;
      animation: drift-b 13s ease-in-out infinite alternate;
    }
    .aurora.c {
      background: radial-gradient(circle, var(--accent2) 0%, transparent 65%);
      top: 30%;
      right: -300px;
      width: 460px;
      height: 460px;
      opacity: 0.22;
      animation: drift-a 15s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift-a { from { transform: translate(0, 0) scale(1); } to { transform: translate(90px, 60px) scale(1.15); } }
    @keyframes drift-b { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-80px, -50px) scale(0.95); } }
    /* floating particles */
    .p {
      position: absolute;
      bottom: -8px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(251, 146, 60, 0.75);
      box-shadow: 0 0 8px 1px rgba(251, 146, 60, 0.5);
      animation: rise linear infinite;
      pointer-events: none;
    }
    .p.violet { background: rgba(167, 139, 250, 0.7); box-shadow: 0 0 8px 1px rgba(167, 139, 250, 0.45); }
    .p.rose { background: rgba(244, 63, 94, 0.6); box-shadow: 0 0 8px 1px rgba(244, 63, 94, 0.4); }
    @keyframes rise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      12% { opacity: 0.9; }
      88% { opacity: 0.7; }
      100% { transform: translateY(-108vh) translateX(26px); opacity: 0; }
    }
    /* stage */
    .stage { position: relative; width: 190px; height: 190px; margin-top: 34px; z-index: 1; }
    .halo {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, var(--accent) 90deg, var(--accent2) 160deg, transparent 220deg);
      animation: spin 2.6s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      filter: drop-shadow(0 0 8px rgba(251, 146, 60, 0.65));
    }
    .halo.rev {
      inset: 6px;
      background: conic-gradient(from 180deg, transparent 0deg, var(--accent3) 80deg, transparent 170deg);
      animation: spin-rev 4.2s linear infinite;
      filter: drop-shadow(0 0 6px rgba(167, 139, 250, 0.5));
    }
    .stage img {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 78px;
      height: 78px;
      border-radius: 20px;
      animation: breathe 2s ease-in-out infinite;
      box-shadow: 0 0 42px 6px rgba(251, 146, 60, 0.35);
    }
    .ring {
      position: absolute;
      inset: 0;
      margin: auto;
      border-radius: 50%;
      border: 2px solid rgba(251, 146, 60, 0.32);
      animation: ripple 2.4s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 0.8s; }
    .ring:nth-child(3) { animation-delay: 1.6s; }
    .orbit { position: absolute; inset: 14px; border-radius: 50%; animation: spin 3.4s linear infinite; }
    .orbit::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 50%;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px 3px rgba(251, 146, 60, 0.8);
    }
    .orbit.two { inset: -2px; animation: spin-rev 5s linear infinite; }
    .orbit.two::before { background: var(--accent3); box-shadow: 0 0 10px 2px rgba(167, 139, 250, 0.75); width: 5px; height: 5px; }
    @keyframes breathe { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.05); } }
    @keyframes ripple { 0% { transform: scale(0.55); opacity: 0.9; } 100% { transform: scale(1.18); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-rev { to { transform: rotate(-360deg); } }
    h1 {
      margin: 16px 0 4px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.01em;
      background: linear-gradient(92deg, #ffe9d6, var(--accent) 38%, var(--accent2) 72%, var(--accent3));
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: hue 5s ease-in-out infinite alternate;
      z-index: 1;
    }
    @keyframes hue { from { background-position: 0% 0; } to { background-position: 100% 0; } }
    #status { color: var(--muted); font-size: 13px; min-height: 18px; z-index: 1; }
    /* steps with connector */
    .steps { display: flex; align-items: flex-start; margin-top: 22px; z-index: 1; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); transition: color 0.3s; width: 92px; }
    .link { width: 44px; height: 2px; margin: 6px -22px 0; background: #232838; border-radius: 2px; overflow: hidden; position: relative; }
    .link::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform: translateX(-101%); transition: transform 0.5s ease; }
    .link.fill::after { transform: translateX(0); }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: #171b28; border: 2px solid #2c3346; transition: 0.3s; }
    .step.active { color: #f5f7fa; font-weight: 600; }
    .step.active .dot {
      border-color: var(--accent);
      background: radial-gradient(circle at 35% 35%, #ffd8b0, var(--accent));
      box-shadow: 0 0 0 4px rgba(251, 146, 60, 0.22), 0 0 14px rgba(251, 146, 60, 0.55);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .step.done { color: var(--ok); }
    .step.done .dot { border-color: var(--ok); background: var(--ok); box-shadow: 0 0 10px rgba(52, 211, 153, 0.45); }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.16), 0 0 12px rgba(251, 146, 60, 0.45); } 50% { box-shadow: 0 0 0 7px rgba(251, 146, 60, 0.3), 0 0 20px rgba(251, 146, 60, 0.7); } }
    /* progress */
    .bar-wrap {
      width: 400px;
      margin-top: 22px;
      height: 7px;
      background: #171b28;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      z-index: 1;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      background-size: 220% 100%;
      border-radius: 8px;
      transition: width 0.25s;
      position: relative;
      overflow: hidden;
      animation: flow 2.4s linear infinite;
      box-shadow: 0 0 12px rgba(251, 146, 60, 0.55);
    }
    @keyframes flow { from { background-position: 0% 0; } to { background-position: 220% 0; } }
    #bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    #barText { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; z-index: 1; }
    .log-area { flex: 1; display: flex; flex-direction: column; align-items: center; margin: 4px 32px 18px; min-height: 0; width: calc(100% - 64px); z-index: 1; }
    #toggleLog { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 0; }
    #toggleLog:hover { color: var(--accent); }
    #log {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      background: rgba(1, 4, 9, 0.82);
      border: 1px solid #2c3346;
      border-radius: 10px;
      padding: 12px;
      overflow-y: auto;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      user-select: text;
      backdrop-filter: blur(6px);
    }
    #log.open { display: block; }
    @media (prefers-reduced-motion: reduce) {
      .stage img, .ring, .orbit, .halo, .step.active .dot, #bar, #bar::after, .aurora, .p, h1 { animation: none; }
      .ring, .orbit, .halo, .p { display: none; }
    }
  </style>
</head>
<body>
  <div class="aurora a"></div>
  <div class="aurora b"></div>
  <div class="aurora c"></div>
  <i class="p" style="left:6%; animation-duration:9s; animation-delay:0s"></i>
  <i class="p violet" style="left:14%; animation-duration:12s; animation-delay:2.2s"></i>
  <i class="p" style="left:22%; animation-duration:10s; animation-delay:4.5s; width:3px; height:3px"></i>
  <i class="p rose" style="left:31%; animation-duration:13s; animation-delay:1.4s"></i>
  <i class="p" style="left:39%; animation-duration:8.5s; animation-delay:5.8s"></i>
  <i class="p violet" style="left:47%; animation-duration:11s; animation-delay:3.1s; width:3px; height:3px"></i>
  <i class="p" style="left:55%; animation-duration:9.5s; animation-delay:0.8s"></i>
  <i class="p rose" style="left:63%; animation-duration:12.5s; animation-delay:6.4s"></i>
  <i class="p" style="left:71%; animation-duration:10.5s; animation-delay:2.9s; width:5px; height:5px"></i>
  <i class="p violet" style="left:79%; animation-duration:9s; animation-delay:4.1s"></i>
  <i class="p" style="left:87%; animation-duration:13.5s; animation-delay:1.9s; width:3px; height:3px"></i>
  <i class="p rose" style="left:94%; animation-duration:11.5s; animation-delay:5.2s"></i>
  <div class="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="halo"></div>
    <div class="halo rev"></div>
    <div class="orbit"></div>
    <div class="orbit two"></div>
    <img src="icon.png" alt="" />
  </div>
  <h1>正在为你准备 DSH Desktop</h1>
  <div id="status">正在准备...</div>
  <div class="steps">
    <div class="step" id="step1"><div class="dot"></div>检测环境</div>
    <div class="link" id="link1"></div>
    <div class="step" id="step2"><div class="dot"></div>下载 Node.js</div>
    <div class="link" id="link2"></div>
    <div class="step" id="step3"><div class="dot"></div>安装 dsh</div>
    <div class="link" id="link3"></div>
    <div class="step" id="step4"><div class="dot"></div>启动服务</div>
  </div>
  <div class="bar-wrap"><div id="bar"></div></div>
  <div id="barText"></div>
  <div class="log-area">
    <button id="toggleLog">查看详情 ▾</button>
    <div id="log"></div>
  </div>
  <script src="setup.js"></script>
</body>
</html>
