<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>DSH Desktop</title>
  <style>
    :root { --accent: #2B6CEA; --accent2: #6a9bff; --ok: #3fb950; --muted: #8b949e; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, #0d1117 55%);
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      user-select: none;
      overflow: hidden;
    }
    .stage { position: relative; width: 170px; height: 170px; margin-top: 44px; }
    .stage img {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      animation: breathe 2s ease-in-out infinite;
    }
    .ring {
      position: absolute;
      inset: 0;
      margin: auto;
      border-radius: 50%;
      border: 2px solid rgba(43, 108, 234, 0.35);
      animation: ripple 2.4s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 0.8s; }
    .ring:nth-child(3) { animation-delay: 1.6s; }
    .orbit {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      animation: spin 3.2s linear infinite;
    }
    .orbit::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 50%;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 10px 2px rgba(106, 155, 255, 0.7);
    }
    @keyframes breathe { 0%, 100% { transform: scale(0.96); } 50% { transform: scale(1.04); } }
    @keyframes ripple {
      0% { transform: scale(0.55); opacity: 0.9; }
      100% { transform: scale(1.15); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 18px 0 4px; font-size: 20px; font-weight: 600; }
    #status { color: var(--muted); font-size: 13px; min-height: 18px; }
    .steps { display: flex; gap: 26px; margin-top: 22px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); transition: color 0.3s; }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #21262d;
      border: 2px solid #30363d;
      transition: 0.3s;
    }
    .step.active { color: #e6edf3; font-weight: 600; }
    .step.active .dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px rgba(43, 108, 234, 0.25); animation: pulse 1.4s ease-in-out infinite; }
    .step.done { color: var(--ok); }
    .step.done .dot { border-color: var(--ok); background: var(--ok); }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px rgba(43, 108, 234, 0.18); } 50% { box-shadow: 0 0 0 6px rgba(43, 108, 234, 0.32); } }
    .bar-wrap {
      width: 380px;
      margin-top: 22px;
      height: 6px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    #bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 6px;
      transition: width 0.25s;
      position: relative;
      overflow: hidden;
    }
    #bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    #barText { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
    .log-area { flex: 1; display: flex; flex-direction: column; align-items: center; margin: 6px 32px 20px; min-height: 0; width: calc(100% - 64px); }
    #toggleLog { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 0; }
    #toggleLog:hover { color: var(--accent); }
    #log {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      background: #010409;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      user-select: text;
    }
    #log.open { display: block; }
    @media (prefers-reduced-motion: reduce) {
      .stage img, .ring, .orbit, .step.active .dot, #bar::after { animation: none; }
      .ring, .orbit { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orbit"></div>
    <img src="icon.png" alt="" />
  </div>
  <h1>正在为你准备 DSH Desktop</h1>
  <div id="status">正在准备...</div>
  <div class="steps">
    <div class="step" id="step1"><div class="dot"></div>检测环境</div>
    <div class="step" id="step2"><div class="dot"></div>下载 Node.js</div>
    <div class="step" id="step3"><div class="dot"></div>安装 dsh</div>
    <div class="step" id="step4"><div class="dot"></div>启动服务</div>
  </div>
  <div class="bar-wrap"><div id="bar"></div></div>
  <div id="barText"></div>
  <div class="log-area">
    <button id="toggleLog">查看详情 ▾</button>
    <div id="log"></div>
  </div>
  <script src="setup.js"></script>
</body>
</html>
