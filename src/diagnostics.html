<!doctype html>

<head>
  <meta charset="utf-8"/>
  <title>dsh-desktop 诊断</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;margin:2rem auto;max-width:720px;color:#1f2328}
    :focus-visible{outline:2px solid #c2410c;outline-offset:2px}

<body>
  <h1>无法连接到 dsh 时</h1>
  <p>本页说明如何在本机找到 DeepSeek Harness（dsh）。不要把授权令牌复制到聊天或工单里。</p>
  <ol>
    <li>在此桌面应用里启动 dsh，或在终端运行 <code>dsh web</code>。</li>
    <li>服务起来后，应用会打开本机回环地址。令牌由应用附加，不必手工粘贴。</li>
    <li>若页面仍打不开，打开「日志」窗口查看启动输出。</li>
  </ol>
</body>
